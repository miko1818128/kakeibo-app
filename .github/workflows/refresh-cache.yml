name: アプリ更新を反映
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 同期機能をアプリ本体へ反映
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          if p.exists():
              s=p.read_text()
              tag='<script src="./sync.js"></script>'
              if tag not in s and '</body>' in s:
                  s=s.replace('</body>',tag+'</body>')
                  p.write_text(s)
          p=Path('sw.js')
          if p.exists():
              s=p.read_text()
              s=re.sub(r"const CACHE='[^']+';", "const CACHE='kakeibo-v20260912-sync';", s, count=1)
              p.write_text(s)
          PY
      - name: 保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet || git commit -m "2人共有の同期機能をアプリ本体に反映"
          git push
