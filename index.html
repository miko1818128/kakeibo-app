<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f3ee"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="♡家計簿"><link rel="manifest" href="manifest.webmanifest"><title>♡ 家計簿</title><style>:root{--bg:#f7f3ee;--paper:#fffdf9;--ink:#403a35;--muted:#8b8178;--line:#e9ddd3;--accent:#b88973;--soft:#f2e5dc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}.app{max-width:720px;margin:auto;min-height:100vh;background:var(--paper)}header{position:sticky;top:0;z-index:5;background:#fffdf9ee;border-bottom:1px solid var(--line);padding:14px 16px}h1{margin:0;font-size:21px}.sub{font-size:12px;color:var(--muted)}main{padding:14px 14px 90px}.screen{display:none}.screen.active{display:block}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:0 5px 18px #49362a0c}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#faf5f0;border-radius:14px;padding:12px}.total{font-size:30px;font-weight:700}.label{font-size:12px;color:var(--muted)}select,input,button{font:inherit}select,input{width:100%;min-height:44px;border:1px solid #dccfc5;border-radius:12px;padding:9px 11px;background:#fffdfb;color:var(--ink);font-size:16px}button{min-height:44px;border:0;border-radius:12px;padding:9px 13px;background:var(--ink);color:white;font-weight:600}.secondary{background:var(--soft);color:var(--ink)}.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(720px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#fffdf9f7;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}.nav button{background:transparent;color:#93877e;border-radius:0;font-size:11px;min-height:58px;padding:7px 2px}.nav button.active{color:var(--accent)}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.dow{text-align:center;font-size:11px;color:var(--muted)}.day{min-height:62px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:5px;text-align:left;color:var(--ink)}.day small{display:block;color:var(--muted);font-size:9px;margin-top:5px}.exp{padding:10px 0;border-bottom:1px solid var(--line)}.tag{display:inline-block;background:var(--soft);padding:2px 6px;border-radius:99px;font-size:10px;margin-right:3px}.field{margin-bottom:9px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}canvas{width:100%}.receipt-result{background:#fbf7f2;border:1px solid var(--line);border-radius:14px;padding:11px;margin-top:10px}.receipt-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.receipt-grid div{background:#fff;border-radius:10px;padding:8px}.receipt-grid span{display:block;font-size:10px;color:var(--muted)}.receipt-grid strong{font-size:13px}.candidate{background:white;color:var(--ink);border:1px solid #dccfc5;margin:3px}.ocr-text{white-space:pre-wrap;font-size:10px;max-height:160px;overflow:auto;background:#fff;padding:8px;border-radius:8px}@media(max-width:430px){main{padding-left:10px;padding-right:10px}.card{padding:13px}.total{font-size:27px}}</style><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script></head><body><div class="app"><header><h1>♡ 家計簿 ♡</h1><div class="sub">スマホで入力・カレンダー・集計</div></header><main><section id="home" class="screen active"><div class="card"><div class="label">表示月</div><select id="homeMonth" onchange="setMonth(this.value)"></select></div><div class="card"><div class="label">今月の支出</div><div id="homeTotal" class="total">¥0</div><div id="homeCount" class="sub"></div></div><div class="grid"><div class="stat"><div class="label">用途トップ</div><b id="topPurpose">-</b></div><div class="stat"><div class="label">支払い方法</div><b id="topPayment">-</b></div></div><div class="card"><b>最近の支出</b><div id="recent"></div></div></section><section id="calendar" class="screen"><div class="row between"><button class="secondary" onclick="moveMonth(-1)">‹</button><b id="calTitle"></b><button class="secondary" onclick="moveMonth(1)">›</button></div><div class="card" style="margin-top:10px"><div class="calendar" id="cal"></div></div><div class="card"><b id="dayTitle">日付を選択</b><div id="dayList"></div></div></section><section id="add" class="screen"><div class="card"><h2 style="margin-top:0">支出を追加</h2><div class="card" style="background:#f8f7fb;margin:0 0 12px"><b>📷 レシート読み取り</b><p class="sub">写真から日付・合計・店舗・分類を読み取ります。保存前に必ず確認してください。</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
<label for="receipt" style="flex:1;min-width:150px;text-align:center;background:#f2e5dc;color:#403a35;border-radius:12px;padding:11px;cursor:pointer;font-weight:600">🖼️ スマホの写真から選ぶ</label>
<label for="receiptCamera" style="flex:1;min-width:150px;text-align:center;background:#f2e5dc;color:#403a35;border-radius:12px;padding:11px;cursor:pointer;font-weight:600">📷 カメラで撮る</label>
</div>
<input id="receipt" type="file" accept="image/*" style="display:none">
<input id="receiptCamera" type="file" accept="image/*" capture="environment" style="display:none"><button id="ocr" style="width:100%;margin-top:8px" onclick="readReceipt()">📷 読み取る</button><div id="ocrStatus" class="sub"></div><div id="ocrResult"></div></div><form onsubmit="saveExpense(event)"><div class="field"><label>日にち</label><input id="date" type="date" required></div><div class="field"><label>用途</label><select id="purpose" required></select></div><div class="field"><label>支払い方法</label><select id="payment" required></select></div><div class="field"><label>誰用?</label><select id="who" required></select></div><div class="field"><label>金額</label><input id="amount" type="number" min="0" required></div><div class="field"><label>値引き（ポイント等）</label><input id="discount" type="number" min="0" value="0"></div><div class="field"><label>分類</label><select id="classification" required></select></div><div class="field"><label>詳細</label><input id="detail" placeholder="お店・メモ"></div><button style="width:100%">保存する</button></form></div></section><section id="summary" class="screen"><div class="card"><div class="label">集計月</div><select id="sumMonth" onchange="setMonth(this.value)"></select></div><div class="grid"><div class="stat"><div class="label">合計</div><b id="sumTotal">¥0</b></div><div class="stat"><div class="label">件数</div><b id="sumCount">0</b></div><div class="stat"><div class="label">平均</div><b id="sumAvg">¥0</b></div><div class="stat"><div class="label">値引き</div><b id="sumDiscount">¥0</b></div></div><div class="card"><b>用途別</b><div id="purposeSummary"></div><canvas id="pChart" height="220"></canvas></div><div class="card"><b>支払い方法別</b><div id="paymentSummary"></div><canvas id="payChart" height="220"></canvas></div></section><section id="settings" class="screen"><div class="card"><h2 style="margin-top:0">設定</h2><p class="sub">データはこのブラウザ内に保存されます。書き出し・読み込みもできます。</p><button onclick="exportData()">データを書き出す</button> <button class="secondary" onclick="document.getElementById('import').click()">読み込む</button><input id="import" type="file" accept=".json" hidden onchange="importData(event)"></div><div id="settingCards"></div></section></main><nav class="nav"><button id="n-home" class="active" onclick="show('home')">🏠<br>ホーム</button><button id="n-calendar" onclick="show('calendar')">📅<br>カレンダー</button><button id="n-add" onclick="show('add')">＋<br>追加</button><button id="n-summary" onclick="show('summary')">📊<br>集計</button><button id="n-settings" onclick="show('settings')">⚙️<br>設定</button></nav></div><script>const months=[...Array(12)].map((_,i)=>String(i+1).padStart(2,'0'));let cur=new Date().toISOString().slice(0,7);let db=JSON.parse(localStorage.getItem('kakeiboDB')||'null')||{records:[],purposes:['食費（外）','食費（家）','日用品','娯楽','医療品','美容','電気代','水道代','ガス代','車関係'],payments:['JCB','VIEWゴールド','Amazon Master','みこポイント','AEON','JRE銀行（現金）','ろうきん（現金）'],who:['2人','とよかわ','みこしば'],classes:['スーパー','コンビニ','飲食店０〜999','飲食店1000〜2999','飲食店3000〜4999','飲食店5000〜','百均','ドラッグストア','通販']};function save(){localStorage.setItem('kakeiboDB',JSON.stringify(db))}function yen(n){return '¥'+Math.round(n||0).toLocaleString('ja-JP')}function monthName(){return cur.slice(0,4)+'年'+(+cur.slice(5,7))+'月'}function list(){return db.records.filter(r=>r.date?.slice(0,7)===cur)}function opts(id,a){document.getElementById(id).innerHTML=a.map(x=>`<option>${x}</option>`).join('')}function init(){const ms=months.map((m,i)=>`<option value="${cur.slice(0,5)+m}">${i+1}月</option>`).join('');homeMonth.innerHTML=ms;sumMonth.innerHTML=ms;homeMonth.value=cur;sumMonth.value=cur;fill();date.value=new Date().toISOString().slice(0,10);render()}function fill(){opts('purpose',db.purposes);opts('payment',db.payments);opts('who',db.who);opts('classification',db.classes)}function setMonth(v){cur=v;homeMonth.value=v;sumMonth.value=v;render()}function moveMonth(d){let x=new Date(cur+'-01');x.setMonth(x.getMonth()+d);cur=x.toISOString().slice(0,7);setMonth(cur)}function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));document.getElementById('n-'+id).classList.add('active');if(id==='settings')renderSettings();if(id==='calendar')renderCalendar();if(id==='summary')renderSummary()}function saveExpense(e){e.preventDefault();db.records.push({date:date.value,purpose:purpose.value,payment:payment.value,who:who.value,amount:+amount.value,discount:+discount.value||0,classification:classification.value,detail:detail.value});save();cur=date.value.slice(0,7);render();e.target.reset();date.value=cur+'-01';alert('保存しました')}function render(){renderHome();renderCalendar();renderSummary()}function renderHome(){const a=list(),total=a.reduce((s,r)=>s+r.amount,0);homeTotal.textContent=yen(total);homeCount.textContent=a.length+'件';let pp={};a.forEach(r=>pp[r.purpose]=(pp[r.purpose]||0)+r.amount);topPurpose.textContent=Object.entries(pp).sort((x,y)=>y[1]-x[1])[0]?.[0]||'-';let pm={};a.forEach(r=>pm[r.payment]=(pm[r.payment]||0)+r.amount);topPayment.textContent=Object.entries(pm).sort((x,y)=>y[1]-x[1])[0]?.[0]||'-';recent.innerHTML=a.slice().sort((x,y)=>y.date.localeCompare(x.date)).slice(0,8).map(r=>`<div class="exp"><div><span class="tag">${r.purpose}</span><span class="tag">${r.payment}</span>${r.detail||''}</div><b>${yen(r.amount)}</b><div class="sub">${r.date} ／ ${r.who}</div></div>`).join('')||'<p class="sub">まだ支出はありません。</p>'}function renderCalendar(){calTitle.textContent=monthName();let x=new Date(cur+'-01'),first=x.getDay(),days=new Date(x.getFullYear(),x.getMonth()+1,0).getDate(),a=list(),h=['日','月','火','水','木','金','土'].map(d=>`<div class="dow">${d}</div>`).join('');for(let i=0;i<first;i++)h+='<div></div>';for(let d=1;d<=days;d++){let s=cur+'-'+String(d).padStart(2,'0'),v=a.filter(r=>r.date===s),t=v.reduce((q,r)=>q+r.amount,0);h+=`<button class="day" onclick="day('${s}')"><b>${d}</b>${t?`<small>${yen(t)}</small>`:''}</button>`}cal.innerHTML=h}function day(s){dayTitle.textContent=s;dayList.innerHTML=list().filter(r=>r.date===s).map(r=>`<div class="exp"><span class="tag">${r.purpose}</span><span class="tag">${r.payment}</span><b>${yen(r.amount)}</b><div class="sub">${r.detail||''} ／ ${r.who}</div></div>`).join('')||'<p class="sub">支出はありません。</p>'}function renderSummary(){let a=list(),total=a.reduce((s,r)=>s+r.amount,0);sumTotal.textContent=yen(total);sumCount.textContent=a.length;sumAvg.textContent=yen(a.length?total/a.length:0);sumDiscount.textContent=yen(a.reduce((s,r)=>s+r.discount,0));draw('purposeSummary','pChart',a,'purpose');draw('paymentSummary','payChart',a,'payment')}function draw(elid,cid,a,key){let m={};a.forEach(r=>m[r[key]]=(m[r[key]]||0)+r.amount);let e=document.getElementById(elid);e.innerHTML=Object.entries(m).sort((x,y)=>y[1]-x[1]).map(x=>`<div class="row between" style="padding:5px 0;border-bottom:1px solid #eee"><span>${x[0]}</span><b>${yen(x[1])}</b></div>`).join('')||'<p class="sub">データなし</p>';let c=document.getElementById(cid),ctx=c.getContext('2d'),w=c.width=c.clientWidth*2,h=c.height=220*2;ctx.clearRect(0,0,w,h);let vals=Object.entries(m).sort((x,y)=>y[1]-x[1]).slice(0,8),mx=Math.max(...vals.map(x=>x[1]),1);ctx.font='22px sans-serif';vals.forEach((x,i)=>{let y=i*52+30,b=x[1]/mx*(w-160);ctx.fillStyle='#b88973';ctx.fillRect(130,y-20,b,30);ctx.fillStyle='#403a35';ctx.fillText(x[0].slice(0,10),4,y);ctx.fillText(yen(x[1]),135+b,y)})}function renderSettings(){const groups=[['purposes','用途','newPurpose'],['payments','支払い方法','newPayment'],['who','誰用？','newWho'],['classes','分類','newClass']];settingCards.innerHTML=groups.map(([k,label,id])=>`<div class="card"><b>${label}</b><div class="row" style="margin:8px 0"><input id="${id}" placeholder="追加する項目"/><button onclick="addItem('${k}','${id}')">追加</button></div>${db[k].map((x,i)=>`<div class="row between" style="padding:7px 0;border-bottom:1px solid #eee"><span>${x}</span><button class="secondary" onclick="removeItem('${k}',${i})">削除</button></div>`).join('')}</div>`).join('')}function addItem(k,id){let v=document.getElementById(id).value.trim();if(!v||db[k].includes(v))return;db[k].push(v);save();fill();renderSettings()}function removeItem(k,i){if(db[k].length<=1)return;if(confirm('削除しますか？過去の支出データは消えません。')){db[k].splice(i,1);save();fill();renderSettings()}}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='家計簿データ.json';a.click()}function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(x.records&&x.purposes){db=x;save();fill();render();alert('読み込みました')}}catch{alert('読み込みに失敗しました')}};r.readAsText(f)}function parseDate(t){let m=t.match(/20\d{2}\s*[年\/.\-]\s*(\d{1,2})\s*[月\/.\-]\s*(\d{1,2})/);return m?`${t.match(/20\d{2}/)[0]}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`:null}function parseTotal(t){let lines=t.split(/\n/),cand=[];for(let l of lines){if(/残高|ポイント|会員|カード|承認|処理|登録番号|店コード|通番|電話/.test(l))continue;for(let m of l.matchAll(/[¥￥]?\s*([0-9]{1,3}(?:[,，][0-9]{3})+|[0-9]{3,6})\s*(?:円)?/g)){let v=+m[1].replace(/[,，]/g,'');if(v>0&&v<1000000)cand.push(v)}}cand=[...new Set(cand)];let hit=lines.filter(l=>/合計|お買上|支払|TOTAL/i.test(l)&&!/残高|ポイント/.test(l)).flatMap(l=>[...l.matchAll(/[¥￥]?\s*([0-9]{1,3}(?:[,，][0-9]{3})+|[0-9]{3,6})/g)].map(m=>+m[1].replace(/[,，]/g,''))).filter(v=>v>0&&v<1000000);let v=hit.sort((a,b)=>b-a)[0]??Math.max(...cand,0);return{value:v||null,candidates:cand.sort((a,b)=>b-a).slice(0,10)}}async function readReceipt(){let f=receipt.files[0] || receiptCamera.files[0];if(!f){alert('写真を選択してください');return}ocr.disabled=true;ocrStatus.textContent='レシートを解析中…';try{let r=await Tesseract.recognize(f,'jpn+eng',{logger:m=>{if(m.status==='recognizing text')ocrStatus.textContent='解析中… '+Math.round((m.progress||0)*100)+'%'}});let t=r.data.text,d=parseDate(t),q=parseTotal(t);if(d)date.value=d;if(q.value)amount.value=q.value;let store=/LAWSON|ローソン/i.test(t)?'LAWSON':/TAIRAYA|たいらや/i.test(t)?'TAIRAYA':/セブン|7-ELEVEN/i.test(t)?'セブン':/マクドナルド/i.test(t)?'マクドナルド':'';if(store)detail.value=store;if(/LAWSON|ローソン|セブン|7-ELEVEN/i.test(t))classification.value='コンビニ';else if(/TAIRAYA|たいらや|スーパー/i.test(t))classification.value='スーパー';if(/JCB/i.test(t))payment.value='JCB';if(/LAWSON|ローソン|セブン|7-ELEVEN|マクドナルド/i.test(t))purpose.value='食費（外）';else if(/TAIRAYA|たいらや|スーパー/i.test(t))purpose.value='食費（家）';let esc=s=>String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));ocrResult.innerHTML=`<div class="receipt-result"><b>🧾 読み取り結果</b><div class="receipt-grid"><div><span>日付</span><strong>${d||'未検出'}</strong></div><div><span>合計</span><strong>${q.value?yen(q.value):'未検出'}</strong></div><div><span>店舗</span><strong>${store||'未検出'}</strong></div><div><span>分類</span><strong>${classification.value||'未検出'}</strong></div></div>${q.candidates.length?'<div class="sub" style="margin-top:8px">金額候補（違う場合はタップ）</div>'+q.candidates.map(v=>`<button class="candidate" onclick="amount.value=${v}">${yen(v)}</button>`).join(''):''}<details><summary>読み取った文字</summary><pre class="ocr-text">${esc(t)}</pre></details></div>`;ocrStatus.textContent='読み取り完了。保存前に内容を確認してください。'}catch(e){console.error(e);ocrStatus.textContent='読み取りに失敗しました。通信状態を確認してもう一度試してください。'}finally{ocr.disabled=false}}init();</script><script src="./sync.js"></script></body></html>
