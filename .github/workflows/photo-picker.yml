name: スマホ写真からレシート選択
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 写真選択ボタンを追加
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<input id="receipt" type="file" accept="image/*" capture="environment">'
          new='''<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
          <label for="receipt" style="flex:1;min-width:150px;text-align:center;background:#f2e5dc;color:#403a35;border-radius:12px;padding:11px;cursor:pointer;font-weight:600">🖼️ スマホの写真から選ぶ</label>
          <label for="receiptCamera" style="flex:1;min-width:150px;text-align:center;background:#f2e5dc;color:#403a35;border-radius:12px;padding:11px;cursor:pointer;font-weight:600">📷 カメラで撮る</label>
          </div>
          <input id="receipt" type="file" accept="image/*" style="display:none">
          <input id="receiptCamera" type="file" accept="image/*" capture="environment" style="display:none">'''
          if old not in s: raise SystemExit('target input not found')
          s=s.replace(old,new,1)
          old_js='function readReceipt(){let f=receipt.files[0];'
          new_js='function readReceipt(){let f=receipt.files[0] || receiptCamera.files[0];'
          if old_js not in s: raise SystemExit('target JS not found')
          s=s.replace(old_js,new_js,1)
          p.write_text(s)
          PY
      - name: 変更を保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "スマホの写真からレシートを選べるようにする"
          git push
