name: アプリ更新を反映
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: キャッシュを更新
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('sw.js')
          if p.exists():
              s=p.read_text()
              import re
              s=re.sub(r"const CACHE='[^']+';", "const CACHE='kakeibo-v20260908-photo';", s, count=1)
              p.write_text(s)
          PY
      - name: 保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js
          git diff --cached --quiet || git commit -m "アプリのキャッシュを更新"
          git push
